<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Premium Store | BGMI Top-Up Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0f1e, #03060c);
            min-height: 100vh;
            color: #eef5ff;
            padding-bottom: 3rem;
        }

        .glass-panel {
            background: rgba(10, 20, 35, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 150, 255, 0.3);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 180, 255, 0.1);
        }

        .btn-primary {
            background: linear-gradient(95deg, #0066ff, #00a6ff);
            border: none;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.3);
            width: 100%;
            text-align: center;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            background: linear-gradient(95deg, #1a77ff, #1fb4ff);
            box-shadow: 0 8px 20px rgba(0, 150, 255, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        input {
            background: #0c1222;
            border: 1px solid #1e3a5f;
            border-radius: 28px;
            padding: 12px 20px;
            color: white;
            font-size: 1rem;
            width: 100%;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.3);
        }

        .top-banner {
            display: flex;
            justify-content: center;
            margin-top: 1.2rem;
            margin-bottom: 1.5rem;
            padding: 0 1rem;
        }

        .banner-img {
            max-width: 90%;
            height: auto;
            max-height: 85px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 160, 255, 0.4));
            border-radius: 20px;
            background: rgba(0,0,0,0.2);
            padding: 5px 20px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }

        .product-card {
            background: linear-gradient(145deg, #0e1625, #070b14);
            border-radius: 2rem;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(0, 140, 255, 0.3);
            box-shadow: 0 15px 30px -12px black;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: #3b82f6;
            box-shadow: 0 25px 40px -12px #0066ff40;
        }

        .product-img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            background: #01050c;
            border-bottom: 1px solid #1e3a5f;
        }

        .product-info {
            padding: 1.5rem;
        }

        .product-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFFFFF, #7abaff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .price-container {
            background: linear-gradient(135deg, #1a2a3a, #0a1220);
            border-radius: 1rem;
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
            border: 1px solid #00a6ff40;
        }

        .price-badge {
            font-size: 2rem;
            font-weight: 800;
            color: #ffd966;
            letter-spacing: 1px;
            display: block;
            margin: 0.25rem 0;
        }

        .price-label {
            font-size: 0.8rem;
            color: #8bb9fe;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .uc-value {
            font-size: 1.2rem;
            background: linear-gradient(95deg, #0066ff20, #00a6ff20);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 60px;
            color: #b8dcff;
            margin: 0.5rem 0;
            font-weight: bold;
            border: 1px solid #2c7da0;
        }

        .page {
            display: none;
            animation: fade 0.25s ease;
        }

        .active-page {
            display: block;
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }

        .warning-text {
            color: #ffae70;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .back-link {
            background: none;
            border: none;
            color: #7abaff;
            cursor: pointer;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-decoration: underline;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(120deg, #c0e0ff, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .loader-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(3, 6, 12, 0.85);
            backdrop-filter: blur(6px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loader-overlay.show {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.15);
            border-top-color: #00a6ff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 1.2rem;
            color: #b8dcff;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .error-box {
            display: none;
            background: #1a1425;
            border: 1px solid #ff7b7b55;
            border-radius: 1rem;
            padding: 14px;
            margin-top: 1rem;
            color: #ffb3b3;
            font-size: 0.9rem;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="top-banner">
    <img class="banner-img" src="https://i.postimg.cc/6QhgC3kb/image-search-1752245026702.png" alt="Premium Store Banner" onerror="this.src='https://via.placeholder.com/400x80?text=Banner'">
</div>

<div class="container">
    <!-- PAGE 1: PRODUCTS -->
    <div id="indexPage" class="page active-page">
        <div style="text-align: center; margin: 0.5rem 0 1rem 0;">
            <h2 style="font-size: 1.8rem;">🔥 PREMIUM TOP-UP CENTER</h2>
            <p style="color: #9ab3d5;">Choose your exclusive UC pack — instant buy now</p>
        </div>

        <div class="products-grid" id="productList"></div>
        <footer>⚡ Secure checkout • Instant UID verification</footer>
    </div>

    <!-- PAGE 2: UID ENTRY -->
    <div id="uidPage" class="page">
        <div class="glass-panel" style="max-width: 580px; margin: 2rem auto; padding: 2rem;">
            <button class="back-link" id="backToProductsFromUid" style="float: right;">← Back</button>
            <h2 style="margin-top: 0;">🎮 Enter Game UID</h2>
            <p style="margin-bottom: 1rem;">We need your UID to process the selected pack</p>
            <div id="selectedPackPreview" style="background:#0f1825; padding: 12px; border-radius: 60px; margin-bottom: 1.5rem; text-align:center; font-weight:bold;"></div>
            <input type="text" id="uidInput" placeholder="Your Game UID (e.g., 1234567890)" autocomplete="off">
            <div style="margin-top: 2rem;">
                <button class="btn-primary" id="proceedToPaymentBtn">Proceed to Payment →</button>
            </div>
            <p class="warning-text" style="margin-top: 1rem;">⚠️ UID is required to deliver UC. Double-check!</p>
            <div id="uidErrorBox" class="error-box"></div>
        </div>
    </div>
</div>

<!-- Loading overlay -->
<div id="loadingOverlay" class="loader-overlay">
    <div class="spinner"></div>
    <div class="loader-text">Generating secure payment link...</div>
</div>

<script>
    // ---------- CONFIG ----------
    const FAM_API_KEY = "fam_5efdd153104ff66aa91a1d78ef53fdb7bde48994";
    const FAM_API_URL = "https://famgateway.in/api/create-order.php";
    // ✅ Updated redirect URL to your Vercel deployment
    const REDIRECT_URL = "https://uc-carding-bgmii.vercel.app/success.html";

    // ---------- PRODUCTS ----------
    const products = [
        { id: 1, name: "Starter Pack",     price: 250,  uc: 3850 },
        { id: 2, name: "Elite Bundle",     price: 450,  uc: 8100 },
        { id: 3, name: "Pro Booster",      price: 850,  uc: 17000 },
        { id: 4, name: "Ultra Pack",       price: 1550, uc: 35000 },
        { id: 5, name: "Legendary Vault",  price: 3100, uc: 80000 }
    ];

    let selectedProduct = null;
    let collectedUID = "";

    // ---------- HELPERS ----------
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pageId).classList.add('active-page');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showLoader(show) {
        document.getElementById('loadingOverlay').classList.toggle('show', show);
    }

    function showUidError(msg) {
        const box = document.getElementById('uidErrorBox');
        if (!msg) {
            box.style.display = 'none';
            box.textContent = '';
        } else {
            box.style.display = 'block';
            box.textContent = msg;
        }
    }

    // ---------- RENDER PRODUCTS ----------
    function renderProducts() {
        const container = document.getElementById('productList');
        container.innerHTML = '';

        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img class="product-img" src="https://i.postimg.cc/1tZRWF8y/image-search-1752389926343.jpg" alt="${product.name}">
                <div class="product-info">
                    <div class="product-title">${product.name}</div>
                    <div class="price-container">
                        <div class="price-label">PRICE</div>
                        <div class="price-badge">₹ ${product.price}</div>
                        <div class="price-label">= ${product.uc.toLocaleString()} UC</div>
                    </div>
                    <div style="text-align: center; margin: 15px 0;">
                        <span class="uc-value">🎮 ${product.uc.toLocaleString()} Unknown Cash</span>
                    </div>
                    <button class="btn-primary buy-now-btn" data-product-id="${product.id}">BUY NOW →</button>
                </div>
            `;
            container.appendChild(card);
        });

        document.querySelectorAll('.buy-now-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = parseInt(this.getAttribute('data-product-id'));
                selectedProduct = products.find(p => p.id === id);
                goToUidPage();
            });
        });
    }

    // ---------- NAVIGATE TO UID PAGE ----------
    function goToUidPage() {
        if (!selectedProduct) return;
        document.getElementById('selectedPackPreview').innerHTML =
            `✅ Selected: ${selectedProduct.name} | ₹${selectedProduct.price} = ${selectedProduct.uc} UC`;
        document.getElementById('uidInput').value = '';
        collectedUID = '';
        showUidError('');
        showPage('uidPage');
    }

    // ---------- CREATE ORDER VIA FAMGATEWAY ----------
    async function createOrderAndRedirect() {
        const uidValue = document.getElementById('uidInput').value.trim();

        if (uidValue === "") {
            showUidError("❌ Please enter your valid Game UID to continue.");
            return;
        }
        if (uidValue.length < 4) {
            showUidError("⚠️ UID seems too short. Please enter the correct ID.");
            return;
        }

        collectedUID = uidValue;
        showUidError('');
        showLoader(true);

        try {
            const response = await fetch(FAM_API_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${FAM_API_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    amount: selectedProduct.price,
                    redirect_url: REDIRECT_URL
                })
            });

            const rawText = await response.text();
            console.log("FamGateway raw response:", rawText);

            let data;
            try {
                data = JSON.parse(rawText);
            } catch (e) {
                throw new Error("Invalid JSON response from gateway: " + rawText.substring(0, 200));
            }

            if (!response.ok) {
                throw new Error(`API error ${response.status}: ${rawText.substring(0, 200)}`);
            }

            const checkoutUrl =
                data.checkout_url ||
                data.payment_url ||
                data.payment_link ||
                data.url ||
                (data.data && (data.data.checkout_url || data.data.payment_url || data.data.url));

            if (!checkoutUrl) {
                throw new Error("No checkout URL returned from gateway. Response: " + rawText.substring(0, 200));
            }

            // Save UID + order info in sessionStorage for success.html
            try {
                sessionStorage.setItem('bgmi_order', JSON.stringify({
                    uid: collectedUID,
                    product: selectedProduct.name,
                    amount: selectedProduct.price,
                    uc: selectedProduct.uc,
                    gateway_response: data
                }));
            } catch (e) { /* ignore */ }

            showLoader(false);
            window.location.href = checkoutUrl;

        } catch (err) {
            console.error("FamGateway error:", err);
            showLoader(false);
            showUidError("⚠️ Payment could not be initiated. " + err.message);
        }
    }

    // ---------- EVENT LISTENERS ----------
    function setupEventListeners() {
        document.getElementById('backToProductsFromUid').addEventListener('click', () => {
            selectedProduct = null;
            collectedUID = '';
            showPage('indexPage');
        });

        document.getElementById('proceedToPaymentBtn').addEventListener('click', createOrderAndRedirect);

        document.getElementById('uidInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                createOrderAndRedirect();
            }
        });
    }

    // ---------- INIT ----------
    window.addEventListener('DOMContentLoaded', () => {
        renderProducts();
        setupEventListeners();
    });
</script>
</body>
</html>
